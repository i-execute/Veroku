[project]
name = "veroku"
version = "0.1.0"
description = "Veroku - VK userbot on web tokens, Hikka-style module system"
requires-python = ">=3.10"
dependencies = ["vkover", "playwright"]
license = "AGPL-3.0"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
veroku = "veroku.main:main"

[tool.setuptools]
packages = ["veroku", "veroku.modules", "veroku.utils"]
